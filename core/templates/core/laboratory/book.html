{% extends "core/base.html" %}
{% load static %}
{% block title %}Book Lab Test{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-content">
    <h1>Book Lab Test</h1>
    <p>Schedule a laboratory test.</p>
  </div>
  <a href="{% url 'lab_test_list' %}" class="btn btn-outline">← Tests</a>
</div>

<div class="card" style="max-width:520px;">
  <div class="card-body">
    {% if error %}
    <div style="background:rgba(217,68,59,0.08);color:var(--color-danger);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:0.875rem;">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="test_id">Test <span style="color:var(--color-danger);">*</span></label>
        <select class="form-select" id="test_id" name="test_id" required>
          <option value="">— Select Test —</option>
          {% for test in tests %}
          <option value="{{ test.id }}" {% if request.GET.test == test.id|stringformat:"s" %}selected{% endif %}>
            {{ test.name }} — E£{{ test.price }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label" for="scheduled_date">Date <span style="color:var(--color-danger);">*</span></label>
          <input class="form-input" type="date" id="scheduled_date" name="scheduled_date" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="scheduled_time">Time <span style="color:var(--color-danger);">*</span></label>
          <input class="form-input" type="time" id="scheduled_time" name="scheduled_time" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:16px;">Book Test</button>
    </form>
  </div>
</div>
{% endblock %}
