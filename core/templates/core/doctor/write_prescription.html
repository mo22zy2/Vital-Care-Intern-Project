{% extends "core/base.html" %}{% load static %}{% block title %}Write Prescription{% endblock %}
{% block content %}
<div class="page-header"><div class="page-header-content"><h1>Write Prescription</h1><p>Create a new prescription for a patient.</p></div><a href="{% url 'doctor_dashboard' %}" class="btn btn-outline">← Dashboard</a></div>
<div class="card" style="max-width:640px;">
  <div class="card-body">
    {% if error %}<div style="background:rgba(217,68,59,0.08);color:var(--color-danger);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:0.875rem;">{{ error }}</div>{% endif %}
    <form method="POST">{% csrf_token %}
      <div class="form-group"><label class="form-label">Patient</label>
        <select class="form-select" name="patient_id" required><option value="">— Select Patient —</option>{% for p in patients %}<option value="{{ p.id }}">{{ p.get_full_name }} ({{ p.email }})</option>{% endfor %}</select>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" name="notes" rows="2"></textarea></div>
      <div class="form-section-title" style="font-size:0.8125rem;font-weight:600;color:var(--color-primary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--color-border-light);">Medications</div>
      <div id="rxItems"><div class="rx-item" style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px;align-items:end;">
        <div class="form-group"><label style="font-size:0.75rem;">Medicine</label><select class="form-select" name="medicine_id"><option value="">—</option>{% for m in medicines %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}</select></div>
        <div class="form-group"><label style="font-size:0.75rem;">Dosage</label><input class="form-input" type="text" name="dosage" placeholder="e.g. 500mg"></div>
        <div class="form-group"><label style="font-size:0.75rem;">Days</label><input class="form-input" type="number" name="duration_days" value="7" style="width:60px;"></div>
        <div class="form-group"><label style="font-size:0.75rem;">Qty</label><input class="form-input" type="number" name="qty" value="1" style="width:50px;"></div>
        <div class="form-group"><label style="font-size:0.75rem;">Instructions</label><input class="form-input" type="text" name="instructions" placeholder="e.g. After meals"></div>
      </div></div>
      <button type="button" class="btn btn-sm btn-outline" onclick="addRxItem()" style="margin-bottom:16px;">+ Add Medicine</button>
      <div><button type="submit" class="btn btn-primary">Create Prescription</button></div>
    </form>
  </div>
</div>
<script>
function addRxItem() {
  var div = document.createElement('div');
  div.className = 'rx-item';
  div.style.cssText = 'display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px;align-items:end;';
  div.innerHTML = document.querySelector('.rx-item').innerHTML;
  document.getElementById('rxItems').appendChild(div);
}
</script>
{% endblock %}
