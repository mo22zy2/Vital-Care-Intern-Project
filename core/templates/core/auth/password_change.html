{% extends "core/base.html" %}{% load static %}{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-header"><div class="page-header-content"><h1>Change Password</h1></div><a href="{% url 'profile' %}" class="btn btn-outline">← Profile</a></div>
<div class="card" style="max-width:420px;">
  <div class="card-body">
    {% if error %}<div style="background:rgba(217,68,59,0.08);color:var(--color-danger);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:0.875rem;">{{ error }}</div>{% endif %}
    {% if success %}<div style="background:rgba(43,140,110,0.08);color:var(--color-success);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:0.875rem;">{{ success }}</div>{% endif %}
    <form method="POST">{% csrf_token %}
      <div class="form-group"><label class="form-label" for="current_password">Current Password</label><input class="form-input" type="password" id="current_password" name="current_password" required></div>
      <div class="form-group"><label class="form-label" for="new_password">New Password</label><input class="form-input" type="password" id="new_password" name="new_password" required minlength="8"></div>
      <div class="form-group"><label class="form-label" for="confirm_password">Confirm New Password</label><input class="form-input" type="password" id="confirm_password" name="confirm_password" required></div>
      <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
  </div>
</div>
{% endblock %}
