{% extends "core/base.html" %}{% load static %}{% block title %}Submit Feedback{% endblock %}
{% block content %}
<div class="page-header"><div class="page-header-content"><h1>Submit Feedback</h1><p>Share your experience with our services.</p></div></div>
<div class="card" style="max-width:540px;">
  <div class="card-body">
    {% if error %}<div style="background:rgba(217,68,59,0.08);color:var(--color-danger);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:0.875rem;">{{ error }}</div>{% endif %}
    <form method="POST">{% csrf_token %}
      <div class="form-group"><label class="form-label">Target</label>
        <select class="form-select" name="target_type"><option value="DOCTOR">Doctor</option><option value="SERVICE">Service</option><option value="FACILITY">Facility</option></select>
      </div>
      <div class="form-group"><label class="form-label">Doctor (optional)</label>
        <select class="form-select" name="doctor_id"><option value="">—</option>{% for d in doctors %}<option value="{{ d.id }}">Dr. {{ d.user.get_full_name }}</option>{% endfor %}</select>
      </div>
      <div class="form-group"><label class="form-label">Rating</label>
        <div style="display:flex;gap:8px;">{% for i in "12345" %}<label style="cursor:pointer;"><input type="radio" name="rating" value="{{ i }}" required> {{ i }}</label>{% endfor %}</div>
      </div>
      <div class="form-group"><label class="form-label" for="comment">Comment</label><textarea class="form-input" id="comment" name="comment" rows="3"></textarea></div>
      <div class="form-group"><label><input type="checkbox" name="is_anonymous"> Submit anonymously</label></div>
      <button type="submit" class="btn btn-primary">Submit Feedback</button>
    </form>
  </div>
</div>
{% endblock %}
